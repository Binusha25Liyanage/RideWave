server {
  listen 80;
  location /api/auth/ { proxy_pass http://auth-service:3001/; }
  location /api/users/ { proxy_pass http://user-service:3002/; }
  location /api/rides/ { proxy_pass http://ride-service:3003/; }
  location /api/pricing/ { proxy_pass http://pricing-service:3005/; }
  location /api/payments/ { proxy_pass http://payment-service:3006/; }
  location /api/reviews/ { proxy_pass http://review-service:3008/; }
  location /ws/location { proxy_pass http://location-service:3004; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
