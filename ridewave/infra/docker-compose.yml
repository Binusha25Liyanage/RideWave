version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6

  api-gateway:
    build: ../services/api-gateway
    working_dir: /app
    command: npm run dev
    env_file: ../services/api-gateway/.env.example
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ../services/api-gateway:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ../services/auth-service
    command: npm run dev
    env_file: ../services/auth-service/.env.example
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - ../services/auth-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ../services/user-service
    command: npm run dev
    env_file: ../services/user-service/.env.example
    environment:
      - PORT=3002
    ports:
      - "3002:3002"
    volumes:
      - ../services/user-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ride-service:
    build: ../services/ride-service
    command: npm run dev
    env_file: ../services/ride-service/.env.example
    environment:
      - PORT=3003
    ports:
      - "3003:3003"
    volumes:
      - ../services/ride-service:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  location-service:
    build: ../services/location-service
    command: npm run dev
    env_file: ../services/location-service/.env.example
    environment:
      - PORT=3004
    ports:
      - "3004:3004"
    volumes:
      - ../services/location-service:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-service:
    build: ../services/pricing-service
    command: npm run dev
    env_file: ../services/pricing-service/.env.example
    environment:
      - PORT=3005
    ports:
      - "3005:3005"
    volumes:
      - ../services/pricing-service:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build: ../services/payment-service
    command: npm run dev
    env_file: ../services/payment-service/.env.example
    environment:
      - PORT=3006
    ports:
      - "3006:3006"
    volumes:
      - ../services/payment-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build: ../services/notification-service
    command: npm run dev
    env_file: ../services/notification-service/.env.example
    environment:
      - PORT=3007
    ports:
      - "3007:3007"
    volumes:
      - ../services/notification-service:/app
      - /app/node_modules
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  review-service:
    build: ../services/review-service
    command: npm run dev
    env_file: ../services/review-service/.env.example
    environment:
      - PORT=3008
    ports:
      - "3008:3008"
    volumes:
      - ../services/review-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
