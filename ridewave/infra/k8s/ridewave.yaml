apiVersion: v1
kind: Namespace
metadata:
  name: ridewave
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ridewave-config
  namespace: ridewave
data:
  KAFKA_BROKER: kafka:9092
  REDIS_URL: redis://redis:6379
  MONGO_URI: mongodb://mongo:27017/ride_db
  LOCATION_SERVICE_URL: http://location-service:3004
  PRICING_SERVICE_URL: http://pricing-service:3005
  DATABASE_URL_AUTH: postgresql://postgres:postgres@postgres:5432/auth_db?schema=public
  DATABASE_URL_USER: postgresql://postgres:postgres@postgres:5432/user_db?schema=public
  DATABASE_URL_PAYMENT: postgresql://postgres:postgres@postgres:5432/payment_db?schema=public
  DATABASE_URL_REVIEW: postgresql://postgres:postgres@postgres:5432/review_db?schema=public
---
apiVersion: v1
kind: Secret
metadata:
  name: ridewave-secrets
  namespace: ridewave
type: Opaque
stringData:
  JWT_SECRET: change-me
  JWT_REFRESH_SECRET: refresh-change-me
  STRIPE_SECRET_KEY: sk_test_xxx
  ORS_API_KEY: your_ors_key
  FIREBASE_ADMIN_SDK: ./firebase-admin.json
  AWS_S3_BUCKET: ridewave-avatars
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ridewave/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ridewave-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ridewave
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ridewave/auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: DATABASE_URL_AUTH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ridewave-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ridewave-secrets
                  key: JWT_REFRESH_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ridewave
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ridewave/user-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: DATABASE_URL_USER
            - name: LOCATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: LOCATION_SERVICE_URL
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ridewave-secrets
                  key: AWS_S3_BUCKET
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ridewave
spec:
  selector:
    app: user-service
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      containers:
        - name: ride-service
          image: ridewave/ride-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: MONGO_URI
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: KAFKA_BROKER
            - name: PRICING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: PRICING_SERVICE_URL
            - name: ORS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ridewave-secrets
                  key: ORS_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: ridewave
spec:
  selector:
    app: ride-service
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
    spec:
      containers:
        - name: location-service
          image: ridewave/location-service:latest
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: REDIS_URL
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: KAFKA_BROKER
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: ridewave
spec:
  selector:
    app: location-service
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: location-service-hpa
  namespace: ridewave
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: location-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: ridewave/pricing-service:latest
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: REDIS_URL
            - name: LOCATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ridewave-config
                  key: LOCATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: ridewave
spec:
  selector:
    app: pricing-service
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ridewave
spec:
  replicas: 2
  selector:
    matchLabels:
