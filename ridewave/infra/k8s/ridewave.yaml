---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ridewave-ingress
  namespace: ridewave
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.ridewave.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000

